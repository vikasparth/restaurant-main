name: CI

on:
  pull_request:
  push:
    branches:
     - main


concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Checkout main branch for schema comparison
        uses: actions/checkout@v4
        with:
          ref: main
          path: temp-main

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate GraphQL schema
        # Run against every schema file so new features are not silently skipped.
        # Previously this ran only against menu.graphql (the default), so orders/reservations/delivery were never checked.
        run: |
          for schema in graphql-gateway/schemas/*.graphql; do
            SCHEMA_PATH=$schema node graphql-gateway/scripts/validate-schema.js
          done

      - name: Check for breaking GraphQL schema changes
        run: |
          npx @graphql-inspector/cli diff \
            "temp-main/graphql-gateway/schemas/**/*.graphql" \
            "graphql-gateway/schemas/**/*.graphql"

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --passWithNoTests

  sentry-release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Sentry release
        uses: getsentry/sentry-release-action@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: restaurant-backend
        with:
          version: ${{ github.sha }}
        