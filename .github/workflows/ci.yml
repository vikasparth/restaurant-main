name: CI

on:
  pull_request:
    paths:
      - "src/**"
      - "graphql-gateway/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/**"


concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --passWithNoTests
