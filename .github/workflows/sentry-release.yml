name: Sentry Release

# Without a Sentry release, errors are reported but have no deploy context —
# you can't tell which commit introduced a bug or whether it's a regression.
# This workflow creates a release in Sentry every time production is updated,
# so each error is linked to the exact code version that caused it.

on:
  push:
    branches:
      - main
      # Only main triggers a release because only main maps to the production
      # deployment. Feature branches should not create releases — they would
      # pollute Sentry's release history with unreleased code.

jobs:
  sentry-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # fetch-depth: 0 fetches the full git history, not just the latest commit.
          # Sentry walks the commit log to associate commits with this release,
          # which powers the "commits in this release" view and suspect commit detection.
          # A shallow clone (the default) would give Sentry nothing to work with.

      - name: Create Sentry release — backend
        uses: getsentry/action-release@v1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: restaurant-backend
        with:
          version: ${{ github.sha }}
          # SHA as version so agents can correlate a Sentry error's first_seen_in_release
          # back to the exact commit and PR that introduced it.

      - name: Create Sentry release — frontend
        uses: getsentry/action-release@v1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: restaurant-frontend
        with:
          version: ${{ github.sha }}
          # Same SHA as backend so all three projects are on the same release identifier —
          # the Frontend Sentry Agent can compare release IDs across projects without remapping.

      - name: Create Sentry release — gateway
        uses: getsentry/action-release@v1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: restaurant-gateway
        with:
          version: ${{ github.sha }}
          # Gateway errors tagged with the same SHA so the orchestrator can correlate
          # a gateway Sentry error with the backend error from the same deploy.
