name: Canary Tests

on:
  schedule:
    - cron: "*/50 * * * *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  canary:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install httpx pytest
        
      - name: Run canary tests
        id: canary
        env:
          API_BASE_URL: "https://restaurant-main.onrender.com"
        run: pytest tests/canary/ -v --noconftest
        working-directory: backend

      - name: Close GitHub issue on recovery
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'canary-failure',
              state: 'open',
            });
            for (const issue of issues) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }

      - name: Open GitHub issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'canary-failure',
              state: 'open',
            });
            if (issues.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '[ALERT] Canary tests failing',
                labels: ['canary-failure'],
                body: `## Canary failure detected\n\n**Workflow run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n**Time:** ${new Date().toISOString()}\n\nOne or more canary tests failed against https://restaurant-main.onrender.com. Check the workflow run for details.\n\n---\n*Auto-generated. Will be closed automatically when canaries pass.*`,
              });
            }
