name: Canary Tests

on:
  schedule:
    - cron: "*/50 * * * *"
  workflow_dispatch:

jobs:
  canary:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install httpx pytest
        
      - name: Run canary tests
        env:
          API_BASE_URL: "https://restaurant-main.onrender.com"
        run: pytest backend/tests/canary/ -v
